# EvoX configuration for symbolic regression (toy Friedman-1 style).
#
# Usage:
#   uv run skydiscover-run initial_program.py evaluator.py -c config_evox.yaml
#
max_iterations: 60
checkpoint_interval: 5
log_level: "INFO"
diff_based_generation: true
max_solution_length: 60000
language: "python"

llm:
  models:
    - name: "gpt-5-mini"
      weight: 1.0
  api_base: "https://api.openai.com/v1"
  temperature: 0.6
  max_tokens: 16000
  timeout: 300
  guide_models:
    - name: "gpt-5-mini"
      api_base: "https://api.openai.com/v1"
      max_tokens: 12000
      timeout: 300

search:
  type: evox
  database:
    auto_generate_variation_operators: true

prompt:
  system_message: |
    You are improving a symbolic regression solver implemented as a Python program.

    The evaluator loads a tabular dataset (X, y), splits it into train/validation, and calls:
      fit_and_predict(X_train, y_train, X_val) -> {"y_pred": ..., "equation": ...}

    Your objective is to maximize validation accuracy while keeping the discovered equation simple and stable.

    Critical constraints:
    - Do NOT change the function signature of fit_and_predict.
    - Always return finite predictions for all rows.
    - Use robust numerical safeguards (clipping, epsilons) for log/div/sqrt.
    - Prefer using SymPy to build a readable equation; complexity is penalized.

evaluator:
  timeout: 120
  max_retries: 2
  cascade_evaluation: false

